<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;1,800&display=swap');

  body {
    margin: 0;
    background: transparent;
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .bar {
    position: relative;
    width: 100vw;
    height: 72px;
    background: linear-gradient(
      90deg,
      #040001 0%,
      #1c0006 22%,
      #38000d 50%,
      #1c0006 78%,
      #040001 100%
    );
    background-size: 200% 200%;
    animation: slowGradient 8s ease-in-out infinite alternate;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-sizing: border-box;
    border-top: 1px solid rgba(255, 40, 70, 0.28);
    border-bottom: 2px solid rgba(255, 20, 50, 0.7);
    box-shadow: inset 0 0 32px rgba(170, 0, 28, 0.5);
  }

  @keyframes slowGradient {
    0%   { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(4, 0, 1, 0.85) 100%);
    z-index: 2;
    pointer-events: none;
  }

  #lightningCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .aura {
    position: absolute;
    width: 360px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 15, 50, 0.38) 0%, rgba(140, 0, 25, 0.16) 55%, transparent 75%);
    filter: blur(26px);
    z-index: 2;
    pointer-events: none;
    animation: gentleAura 6s ease-in-out infinite alternate;
  }

  @keyframes gentleAura {
    0%   { transform: translateX(-140px) scale(0.95); opacity: 0.65; }
    100% { transform: translateX(140px) scale(1.15); opacity: 0.92; }
  }

  .content-wrapper {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .content {
    display: flex;
    align-items: center;
    gap: 24px;
    color: #ffffff;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 0.4px;
    text-shadow:
      0 0 12px rgba(255, 30, 60, 0.8),
      0 0 24px rgba(200, 0, 30, 0.6),
      0 2px 6px rgba(0, 0, 0, 0.95);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, filter 0.3s ease;
  }

  .glow-underline {
    margin-top: 5px;
    height: 3px;
    width: 105%;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, #ff1e42 18%, #ffffff 50%, #ff1e42 82%, transparent);
    box-shadow:
      0 0 6px #ffffff,
      0 0 14px rgba(255, 20, 50, 0.85),
      0 0 24px rgba(200, 0, 30, 0.6);
    animation: pulseLine 2s ease-in-out infinite;
  }

  @keyframes pulseLine {
    0%, 100% { transform: scaleX(0.92); opacity: 0.85; }
    50%      { transform: scaleX(1.04); opacity: 1; }
  }

  .item {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .divider {
    width: 2px;
    height: 20px;
    background: linear-gradient(to bottom, transparent, rgba(255, 60, 90, 0.7), #ffffff, rgba(255, 60, 90, 0.7), transparent);
  }

  .logo-tt {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    filter: drop-shadow(0 0 6px rgba(255, 34, 68, 0.75));
  }

  .logo-yt {
    width: 38px;
    height: 38px;
    object-fit: contain;
    mix-blend-mode: lighten;
    filter: contrast(1.2) drop-shadow(0 0 8px rgba(255, 20, 50, 0.8));
  }

  .logo-ig {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    object-fit: cover;
    filter: drop-shadow(0 0 7px rgba(255, 34, 68, 0.8));
  }

  .saweria-badge {
    font-style: italic;
    font-size: 25px;
    color: #ffffff;
    text-shadow:
      0 0 12px rgba(255, 30, 60, 0.85),
      0 2px 6px rgba(0, 0, 0, 0.95);
  }
</style>
</head>
<body>
  <div class="bar">
    <canvas id="lightningCanvas"></canvas>
    <div class="aura"></div>
    <div class="vignette"></div>

    <div class="content-wrapper">
      <div class="content" id="display"></div>
      <div class="glow-underline"></div>
    </div>
  </div>

  <script>
    // ── 1. VERTICAL FRACTAL LIGHTNING (MUNCUL HANYA SAAT ROTASI) ───────────
    const canvas = document.getElementById("lightningCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function generateVerticalFractal(x1, y1, x2, y2, displace, iterations) {
      let points = [{ x: x1, y: y1 }, { x: x2, y: y2 }];
      let curDisplace = displace;

      for (let iter = 0; iter < iterations; iter++) {
        let nextPoints = [points[0]];
        for (let i = 0; i < points.length - 1; i++) {
          const p1 = points[i];
          const p2 = points[i + 1];
          const midX = (p1.x + p2.x) / 2 + (Math.random() - 0.5) * curDisplace;
          const midY = (p1.y + p2.y) / 2 + (Math.random() - 0.5) * (curDisplace * 0.35);
          nextPoints.push({ x: midX, y: midY }, p2);
        }
        points = nextPoints;
        curDisplace *= 0.54;
      }
      return points;
    }

    let activeBolts = [];

    function triggerRotationLightning() {
      const positions = [
        canvas.width * (0.14 + Math.random() * 0.12),
        canvas.width * (0.74 + Math.random() * 0.12)
      ];

      for (const startX of positions) {
        const fromTop = Math.random() < 0.7;
        const startY = fromTop ? 0 : canvas.height;
        const endX = startX + (Math.random() - 0.5) * 140;
        const endY = fromTop ? canvas.height : 0;

        const mainPts = generateVerticalFractal(startX, startY, endX, endY, 42, 5);

        const branches = [];
        for (const ratio of [0.32, 0.65]) {
          const idx = Math.floor(mainPts.length * ratio);
          const origin = mainPts[idx];
          const bEndX = origin.x + (Math.random() - 0.5) * 90;
          const bEndY = fromTop
            ? Math.min(canvas.height, origin.y + 18 + Math.random() * 24)
            : Math.max(0, origin.y - 18 - Math.random() * 24);
          branches.push(generateVerticalFractal(origin.x, origin.y, bEndX, bEndY, 18, 3));
        }

        activeBolts.push({
          mainPts,
          branches,
          alpha: 0,
          maxAlpha: 0.9,
          phase: "in",
          inSpeed: 0.16,
          outSpeed: 0.024,
          width: 1.5
        });
      }
    }

    function drawBolt(pts, width, alpha) {
      if (pts.length < 2 || alpha <= 0) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = `rgba(255, 10, 40, ${alpha * 0.42})`;
      ctx.lineWidth = width * 5;
      ctx.shadowColor = "rgba(255, 15, 45, 0.95)";
      ctx.shadowBlur = 14;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = `rgba(255, 75, 100, ${alpha * 0.95})`;
      ctx.lineWidth = width * 1.75;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = `rgba(255, 200, 210, ${alpha})`;
      ctx.lineWidth = width * 0.8;
      ctx.stroke();

      ctx.restore();
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = activeBolts.length - 1; i >= 0; i--) {
        const b = activeBolts[i];
        if (b.phase === "in") {
          b.alpha += b.inSpeed;
          if (b.alpha >= b.maxAlpha) {
            b.alpha = b.maxAlpha;
            b.phase = "out";
          }
        } else {
          b.alpha -= b.outSpeed;
        }

        drawBolt(b.mainPts, b.width, b.alpha);
        for (const br of b.branches) {
          drawBolt(br, b.width * 0.55, b.alpha * 0.8);
        }

        if (b.phase === "out" && b.alpha <= 0) {
          activeBolts.splice(i, 1);
        }
      }

      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ── 2. ROTATING SLIDES (YT + TT + IG <-> SOCIABUZZ// ) ───────────────────────
    const slides = [
      `
        <div class="item">
          <img src="yt.png" class="logo-yt">
          <span>mewathegreat</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <img src="tt.png" class="logo-tt">
          <span>mewanuthing</span>
        </div>
        <div class="divider"></div>
        <div class="item">
          <img src="ig.png" class="logo-ig">
          <span>shastaygeekin</span>
        </div>
      `,
      `
        <div class="item">
          <span class="saweria-badge">https://sociabuzz.com/pasha1234/tribe</span>
        </div>
      `
    ];

    let index = 0;
    const el = document.getElementById("display");
    el.innerHTML = slides[0];
    setTimeout(triggerRotationLightning, 300);

    setInterval(() => {
      triggerRotationLightning();

      el.style.opacity = "0";
      el.style.filter = "blur(4px)";
      el.style.transform = "translateY(-14px) scale(0.97)";

      setTimeout(() => {
        index = (index + 1) % slides.length;
        el.innerHTML = slides[index];

        el.style.transition = "none";
        el.style.transform = "translateY(14px) scale(0.97)";
        void el.offsetWidth;

        el.style.transition = "transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, filter 0.3s ease";
        el.style.opacity = "1";
        el.style.filter = "blur(0px)";
        el.style.transform = "translateY(0) scale(1)";
      }, 300);
    }, 2000);
  </script>
</body>
</html>
